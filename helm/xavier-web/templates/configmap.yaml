apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xavier-web.fullname" . }}-html
  labels:
    {{- include "xavier-web.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Proyecto GitOps de Xavier Fernandez</title>
      <style>
        body{background:#f4f7fb;color:#182b49;font-family:Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
        main{background:#fff;border:1px solid #dce4f1;border-radius:20px;box-shadow:0 18px 45px #162a4814;padding:45px;text-align:center;max-width:580px}
        h1{font-size:30px;margin:0 0 18px}
        p{font-size:18px;line-height:1.7}
        .tag{display:inline-block;border-radius:999px;padding:9px 17px;background:#ebf2ff;color:#295bb5;font-weight:bold}
      </style>
    </head>
    <body>
      <main>
        <div class="tag">GitOps / Helm / Kubernetes</div>
        <h1>{{ .Values.page.title }}</h1>
        <p>{{ .Values.page.subtitle }}</p>
        <p><strong>{{ .Values.page.version }}</strong></p>
      </main>
    </body>
    </html>
